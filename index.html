<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#08080b;color:#f6f4f8;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.hidden{display:none!important}
.bg-grid{position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:56px 56px;mask-image:linear-gradient(to bottom,black 0%,transparent 85%);-webkit-mask-image:linear-gradient(to bottom,black 0%,transparent 85%)}
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;opacity:.18}
.orb-a{width:420px;height:420px;background:#ed2da2;right:-160px;top:60px}
.orb-b{width:360px;height:360px;background:#7b45ff;left:-190px;bottom:-80px}
.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:76px;padding:0 5vw;display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(8,8,11,.72);backdrop-filter:blur(18px);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.04em;font-size:13px}
.brand-dot{width:8px;height:8px;border-radius:50%;background:#ff3fae;box-shadow:0 0 18px #ff3fae}
.pink{color:#ff3fae}
.wrap{min-height:100%;display:grid;place-items:center;padding:110px 5vw 40px;position:relative;z-index:1}
.card{width:min(940px,100%);display:grid;grid-template-columns:1.1fr .9fr;border:1px solid rgba(255,255,255,.12);border-radius:24px;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015));box-shadow:0 35px 90px rgba(0,0,0,.42)}
.form-side{padding:48px 44px}
.eyebrow{font:700 11px/1 "Space Grotesk",Inter,sans-serif;letter-spacing:.18em;color:#85808c;display:flex;align-items:center}
.eyebrow i{display:inline-block;width:32px;height:1px;background:#ff3fae;margin-right:10px}
h1{font:800 clamp(40px,5.4vw,60px)/.9 "Space Grotesk",Inter,sans-serif;letter-spacing:-.05em;margin:20px 0 18px}
h1 em{font-style:normal;border-bottom:3px solid #ff3fae}
.lede{color:#a9a3ae;font-size:15px;line-height:1.65;margin:0 0 28px;max-width:420px}
.field{position:relative}
#staticrypt-password{width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.14);border-radius:12px;color:#fff;padding:15px 92px 15px 16px;font:500 16px Inter,system-ui,sans-serif;outline:none}
#staticrypt-password:focus{border-color:rgba(255,77,180,.7);box-shadow:0 0 0 4px rgba(255,61,176,.12)}
#staticrypt-password::placeholder{color:#5e5963}
.toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:1px solid rgba(255,255,255,.1);color:#a7a0aa;border-radius:999px;padding:6px 10px;font:500 12px Inter,system-ui,sans-serif;cursor:pointer}
.toggle:hover{color:#fff;border-color:rgba(255,77,180,.55)}
.err{min-height:20px;color:#ff8fa8;font-size:13px;margin:10px 0 4px}
.remember{display:flex;align-items:center;gap:10px;color:#a7a0aa;font-size:13px;margin:4px 0 22px;cursor:pointer}
.remember input{width:18px;height:18px;accent-color:#ff3fae}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;width:100%;padding:15px 19px;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:linear-gradient(135deg,#ff42b0,#8749ff);color:#fff;font:700 15px Inter,system-ui,sans-serif;box-shadow:0 16px 60px rgba(192,53,180,.22);cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.note{margin-top:22px;font-size:12px;color:#6c6772;line-height:1.6}
:focus-visible{outline:2px solid #ff3fae;outline-offset:3px}
.art-side{position:relative;min-height:420px;background:radial-gradient(circle at 50% 40%,rgba(255,68,176,.14),transparent 55%),linear-gradient(to bottom,rgba(255,255,255,.025),transparent);border-left:1px solid rgba(255,255,255,.08);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.art-side::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 4px,rgba(255,255,255,.015) 5px);pointer-events:none}
.art-side img{position:relative;height:92%;max-height:440px;width:auto;object-fit:contain;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
.shadow{position:absolute;bottom:22px;width:60%;height:30px;border-radius:50%;background:#000;filter:blur(18px);opacity:.8}
.badge{position:absolute;left:20px;top:20px;padding:8px 10px;border:1px solid rgba(255,255,255,.1);border-radius:999px;color:#aca6b0;background:rgba(0,0,0,.25);font-size:10px;letter-spacing:.08em;z-index:2}
.loading{min-height:100%;display:grid;place-items:center}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:#ff3fae;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:760px){.card{grid-template-columns:1fr}.art-side{display:none}.form-side{padding:34px 24px}}
@media (prefers-reduced-motion:reduce){.spinner,.shake{animation:none}}
</style>
